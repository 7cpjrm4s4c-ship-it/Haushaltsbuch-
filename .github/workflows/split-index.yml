name: Index strukturell zerlegen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/split-index.yml'
      - 'tools/split-index.mjs'

permissions:
  contents: write

jobs:
  split-index:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Index zerlegen
        run: npm run split:index

      - name: Tests ausführen
        run: npm run check

      - name: Dateistruktur prüfen
        run: |
          test -f css/app.css
          test -f js/app.js
          test -f backup/index.monolith.html
          grep -q 'css/app.css' index.html
          grep -q 'js/app.js' index.html
          ! grep -q '<style>' index.html

      - name: Änderungen übernehmen
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Keine Änderungen erforderlich.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/app.css js/app.js backup/index.monolith.html
          git commit -m 'Zerlege Index in HTML, CSS und JavaScript'
          git push origin main
